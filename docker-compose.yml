# docker-compose.yml
version: '3.8'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: go_micro_postgres
    environment:
      POSTGRES_DB: myapp_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:

      - "5432:5432"
    volumes:

      - ./data/postgres:/var/lib/postgresql/data
      - ./init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:

      - microservice-net

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: go_micro_redis
    command: redis-server --appendonly yes
    ports:

      - "6379:6379"
    volumes:

      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:

      - microservice-net

  # Zookeeper 服务（Kafka 依赖）
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: go_micro_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:

      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo stat | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:

      - microservice-net

  # Kafka 消息队列服务
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: go_micro_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:

      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 && echo 'healthy' || echo 'unhealthy'"]
      interval: 15s
      timeout: 10s
      retries: 6
    restart: unless-stopped
    networks:

      - microservice-net

# 自定义网络，确保服务间通信
networks:
  microservice-net:
    driver: bridge

# 数据卷声明（使用本地路径映射实现持久化）
volumes:
  postgres_data:
  redis_data:
